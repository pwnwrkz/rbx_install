[package]
name = "rbx_install"
version = "0.1.0"
edition = "2024"

[dependencies]
thiserror = "2.0.18"
dirs = "6.0.0"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.56.0"

[target.'cfg(target_os = "linux")'.dependencies]
reqwest = { version = "0.11", optional = true, features = ["blocking", "rustls-tls", "json"], default-features = false }
serde_json = { version = "1.0", optional = true }

[features]
default = []
vinegar = ["dep:reqwest", "dep:serde_json"]

[profile.dist]
inherits = "release"
lto = "thin"
