[package]
name = "rbx_install"
description = "Rust crate to locate Roblox Studio installations."
version = "1.1.0"
edition = "2024"
license-file = "LICENSE"
readme = "README.md"
repository = "https://github.com/pwnwrkz/rbx_install"
keywords = ["roblox", "install"]

[dependencies]
thiserror = "2.0.18"
dirs = "6.0.0"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.56.0"

[dev-dependencies]
tempfile = "3"
